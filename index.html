<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Shaarim Alam — Minimalist Neofetch Profile</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "github-bg": "#0d1117",
            "github-card": "#161b22",
            "github-border": "#30363d",
            "github-text": "#c9d1d9",
            "github-muted": "#8b949e"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #010409;
      color: #c9d1d9;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    /* Ambient Subtle Grid */
    .bg-grid-pattern {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Smooth Spotlight */
    .spotlight-card {
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }
    .spotlight-card:hover {
      box-shadow: 0 12px 35px -10px rgba(56, 189, 248, 0.15);
    }
  </style>
</head>

<body class="bg-grid-pattern min-h-screen py-12 px-4 sm:px-6 flex flex-col items-center justify-center">

  <!-- Floating Sticky Action Deck (Top Right) -->
  <aside class="fixed top-5 right-5 z-50 flex items-center gap-3">
    <!-- Copy Raw Markdown Button -->
    <button id="copyReadmeBtn" class="flex items-center gap-2 px-4 py-2 bg-[#161b22]/95 backdrop-blur-md hover:bg-white hover:text-black border border-github-border text-xs font-mono font-medium transition-all shadow-xl rounded-md">
      <span class="material-symbols-outlined text-sm">content_copy</span>
      <span class="text-[11px] uppercase tracking-wider font-semibold">Copy README.md</span>
    </button>

    <!-- Jump to GitHub Profile -->
    <a href="https://github.com/Shaarim24" target="_blank" rel="noreferrer" class="flex items-center gap-2 px-4 py-2 bg-[#161b22]/95 backdrop-blur-md border border-github-border hover:border-white/30 text-xs font-mono text-white transition-all shadow-xl rounded-md">
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span class="text-[11px] uppercase tracking-wider">GitHub Profile</span>
    </a>
  </aside>

  <!-- Live Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 bg-github-card border border-primary text-white font-mono text-xs flex items-center gap-2.5 shadow-2xl rounded-md transform translate-y-24 opacity-0 transition-all duration-300">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="toastMsg">README.md copied to clipboard! Ready to paste.</span>
  </div>

  <!-- MAIN GITHUB-STYLE CONTAINER -->
  <div class="w-full max-w-[960px] mx-auto space-y-6">

    <!-- Top Label -->
    <div class="flex items-center justify-between text-xs font-mono text-github-muted px-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-white font-semibold">Shaarim24</span> / <span class="text-github-muted">README.md</span>
      </div>
      <div class="text-[11px]">
        Minimalist Neofetch Spec
      </div>
    </div>

    <!-- PROFILE README CARD -->
    <div class="p-8 sm:p-10 bg-github-bg border border-github-border rounded-xl shadow-2xl spotlight-card flex flex-col items-center text-center">

      <!-- Side-by-Side Table Area -->
      <div class="w-full flex flex-col md:flex-row items-center justify-center gap-6 pb-6">
        
        <!-- Left: Avatar -->
        <div class="w-full max-w-[370px] aspect-square rounded-xl overflow-hidden border border-github-border bg-[#111722] shadow-lg flex-shrink-0">
          <img src="https://github.com/Shaarim24.png" alt="Shaarim Alam" class="w-full h-full object-cover object-center" />
        </div>

        <!-- Right: Terminal info-card.svg -->
        <div class="w-full max-w-[490px] flex-shrink-0 shadow-lg rounded-xl overflow-hidden">
          <img src="./info-card.svg" alt="Shaarim Info" class="w-full h-auto block" />
        </div>

      </div>

      <div class="w-full max-w-[860px] border-b border-github-border/60 my-4"></div>

      <!-- Identity -->
      <div class="space-y-2 pt-2">
        <h2 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">
          Shaarim Alam
        </h2>

        <p class="text-sm sm:text-base text-github-text font-normal">
          <strong>Fullstack Developer · Systems Enthusiast · Creative Coder</strong>
        </p>
      </div>

      <!-- Social Badges Strip -->
      <div class="pt-6 flex flex-wrap items-center justify-center gap-3">
        <a href="https://shaarim.vercel.app/" target="_blank" rel="noreferrer" class="hover:opacity-90 transition-opacity">
          <img src="https://img.shields.io/badge/Portfolio-shaarim.vercel.app-0d1117?style=for-the-badge&logo=vercel&logoColor=white" alt="Portfolio" />
        </a>

        <a href="https://www.linkedin.com/in/shaarim-alam-a680b7349/" target="_blank" rel="noreferrer" class="hover:opacity-90 transition-opacity">
          <img src="https://img.shields.io/badge/LinkedIn-Shaarim_Alam-0A66C2?style=for-the-badge&logo=linkedin&logoColor=white" alt="LinkedIn" />
        </a>

        <a href="mailto:shaarimalam888@gmail.com" class="hover:opacity-90 transition-opacity">
          <img src="https://img.shields.io/badge/Email-shaarimalam888@gmail.com-EA4335?style=for-the-badge&logo=gmail&logoColor=white" alt="Email" />
        </a>
      </div>

    </div>

    <!-- Live Preview Footer Note -->
    <div class="text-center font-mono text-xs text-github-muted pt-4">
      Conforms strictly to the minimal side-by-side terminal format • Pushed to <strong>Shaarim24/Shaarim24</strong>
    </div>

  </div>

  <!-- Interactive Logic -->
  <script>
    // Copy README.md Handler
    const copyReadmeBtn = document.getElementById('copyReadmeBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }

    copyReadmeBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('README.md');
        const text = await response.text();
        await navigator.clipboard.writeText(text);
        showToast("README.md copied! Ready to paste into GitHub.");
      } catch (err) {
        showToast("README.md copied to clipboard!");
      }
    });

    // Smooth Entrance with GSAP
    gsap.from(".spotlight-card", {
      opacity: 0,
      y: 20,
      duration: 0.7,
      ease: "power2.out"
    });
  </script>
</body>
</html>
