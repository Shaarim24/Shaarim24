<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 185" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow4" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#040609" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <style>
      .font-sans-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Inter, sans-serif;
        font-weight: 700;
      }
      .font-mono-tech {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace;
      }
      .font-sans-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Inter, sans-serif;
      }
    </style>
  </defs>

  <rect width="470" height="185" fill="url(#cardGlow4)" rx="4" />
  <rect x="0.5" y="0.5" width="469" height="184" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="4" />

  <g transform="translate(24, 22)">
    <!-- Header Spec -->
    <g class="font-mono-tech" font-size="9">
      <text x="0" y="0" fill="#38bdf8" font-weight="600" letter-spacing="1.5">04 // SYSTEMS &amp; AUTOMATION</text>
      <text x="422" y="0" fill="#64748b" text-anchor="end" letter-spacing="1">ZERO-COPY I/O</text>
    </g>

    <line x1="0" y1="10" x2="422" y2="10" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- Title -->
    <text x="0" y="34" class="font-sans-title" fill="#ffffff" font-size="18" letter-spacing="-0.4">
      Veltrix &amp; Lua Systems Lab
    </text>

    <!-- Description -->
    <text x="0" y="56" class="font-sans-body" fill="#94a3b8" font-size="11">
      High-throughput file converter &amp; Lua engine automations.
    </text>
    <text x="0" y="74" class="font-sans-body" fill="#94a3b8" font-size="11">
      Memory-mapped I/O, POSIX shell tooling, and game scripting.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 96)" class="font-mono-tech" font-size="8.5">
      <rect x="0" y="0" width="64" height="20" fill="#0c1017" stroke="rgba(56, 189, 248, 0.3)" rx="2" />
      <text x="32" y="13" fill="#38bdf8" text-anchor="middle">Lua 5.4</text>

      <rect x="70" y="0" width="54" height="20" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="97" y="13" fill="#e2e8f0" text-anchor="middle">POSIX</text>

      <rect x="130" y="0" width="82" height="20" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="171" y="13" fill="#e2e8f0" text-anchor="middle">Stream I/O</text>

      <rect x="218" y="0" width="76" height="20" fill="#0c1017" stroke="rgba(16, 185, 129, 0.25)" rx="2" />
      <text x="256" y="13" fill="#10b981" text-anchor="middle">Fast CLI</text>
    </g>

    <!-- Action Link -->
    <g transform="translate(0, 134)" class="font-mono-tech" font-size="9">
      <text x="0" y="0" fill="#38bdf8" font-weight="600" letter-spacing="1">VIEW REPOSITORIES →</text>
      <text x="422" y="0" fill="#64748b" text-anchor="end">SHAARIM24 / VELTRIX</text>
    </g>
  </g>
</svg>
