<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <pattern id="memGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" />
    </pattern>
    <linearGradient id="sigGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0bcff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.8" />
    </linearGradient>
    <style>
      @keyframes traceSignal {
        0% { stroke-dashoffset: 680; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #5eead4); }
      }
      .signal-line {
        stroke-dasharray: 40, 20;
        animation: traceSignal 6s linear infinite;
      }
      .blinking {
        animation: blinkDot 2s ease-in-out infinite;
      }
      .mono-tech {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .serif-display {
        font-family: 'Instrument Serif', Georgia, serif;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="280" fill="#080b10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="4" />
  <rect x="12" y="12" width="896" height="256" fill="url(#memGrid)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.5" />

  <!-- Schematic Header -->
  <g transform="translate(28, 34)" class="mono-tech">
    <text x="0" y="0" fill="#5eead4" font-size="9.5" font-weight="600" letter-spacing="2.2">
      ARCHITECTURAL SCHEMATIC // EXHIBIT B
    </text>
    <text x="0" y="18" class="serif-display" fill="#ffffff" font-size="19" letter-spacing="0">
      Zero-Jank Motion Pipeline &amp; 120 FPS Frame Budget Allocation
    </text>
    <text x="864" y="0" fill="#8f96a6" font-size="8.5" text-anchor="end" letter-spacing="1.2">
      FIGURE 2.4 — 8.33ms DISPATCH SPECIFICATION
    </text>
  </g>

  <!-- Timeline / Memory Body Base -->
  <g transform="translate(28, 80)">
    <!-- Base Bar Outline -->
    <rect x="0" y="0" width="864" height="42" fill="#11151c" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="2" />

    <!-- 64-Byte / Phase Dividers (dashed lines) -->
    <line x1="120" y1="0" x2="120" y2="42" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="3,3" />
    <line x1="330" y1="0" x2="330" y2="42" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="3,3" />
    <line x1="435" y1="0" x2="435" y2="42" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="3,3" />
    <line x1="565" y1="0" x2="565" y2="42" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="3,3" />
    <line x1="720" y1="0" x2="720" y2="42" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="3,3" />

    <!-- Phase 1: Pointer Input Interrupt (0 - 120px) -->
    <rect x="0" y="0" width="120" height="42" fill="rgba(208, 188, 255, 0.22)" stroke="#d0bcff" stroke-width="1.2" rx="2" />
    <text x="60" y="24" class="mono-tech" fill="#ffffff" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1">INPUT_DISPATCH</text>

    <!-- Phase 2: GSAP / Verlet Physics Calculation (120 - 330px) -->
    <rect x="120" y="0" width="210" height="42" fill="rgba(94, 234, 212, 0.2)" stroke="#5eead4" stroke-width="1.2" />
    <text x="225" y="24" class="mono-tech" fill="#5eead4" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1">GSAP SPRING COMPUTATION (2.1ms)</text>

    <!-- Phase 3: GC Guard / Microtask Buffer (330 - 435px) -->
    <rect x="330" y="0" width="105" height="42" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="382" y="24" class="mono-tech" fill="#636c7e" font-size="8" text-anchor="middle" letter-spacing="1">GC GUARD PAD</text>

    <!-- Phase 4: WebGL Uniform Upload (435 - 565px) -->
    <rect x="435" y="0" width="130" height="42" fill="rgba(249, 168, 212, 0.2)" stroke="#f9a8d4" stroke-width="1.2" />
    <text x="500" y="24" class="mono-tech" fill="#f9a8d4" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1">WEBGL SHADER PASS</text>

    <!-- Phase 5: Hardware V-Sync Flush (565 - 864px) -->
    <text x="714" y="24" class="mono-tech" fill="#454c5c" font-size="8" text-anchor="middle" letter-spacing="1.2">V-SYNC COMPOSITOR HEADROOM (3.8ms FREE)</text>

    <!-- Active Pulse Line Tracking along the bar -->
    <line x1="0" y1="42" x2="864" y2="42" stroke="url(#sigGlow)" stroke-width="2" class="signal-line" />

    <!-- Top Time Annotations -->
    <g class="mono-tech" font-size="8" fill="#636c7e">
      <text x="0" y="-8">0.00ms (t₀)</text>
      <text x="120" y="-8">+1.12ms</text>
      <text x="330" y="-8">+3.22ms</text>
      <text x="435" y="-8">+4.25ms</text>
      <text x="565" y="-8">+5.80ms</text>
      <text x="864" y="-8" text-anchor="end">8.33ms [DEADLINE]</text>
    </g>

    <!-- Callouts Bottom with Precision Pins -->
    <!-- Callout 1 -->
    <g transform="translate(60, 42)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#d0bcff" stroke-width="1" />
      <circle cx="0" cy="28" r="2.5" fill="#d0bcff" class="blinking" />
      <text x="0" y="44" class="mono-tech" fill="#d0bcff" font-size="8.5" text-anchor="middle" font-weight="600">Passive Pointer Bus</text>
      <text x="0" y="56" class="mono-tech" fill="#636c7e" font-size="7.5" text-anchor="middle">Latency: 1.2µs latch</text>
    </g>

    <!-- Callout 2 -->
    <g transform="translate(225, 42)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#5eead4" stroke-width="1" />
      <circle cx="0" cy="28" r="2.5" fill="#5eead4" class="blinking" />
      <text x="0" y="44" class="mono-tech" fill="#5eead4" font-size="8.5" text-anchor="middle" font-weight="600">Verlet Matrix Solver</text>
      <text x="0" y="56" class="mono-tech" fill="#636c7e" font-size="7.5" text-anchor="middle">Zero Allocations / GC Free</text>
    </g>

    <!-- Callout 3 -->
    <g transform="translate(500, 42)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#f9a8d4" stroke-width="1" />
      <circle cx="0" cy="28" r="2.5" fill="#f9a8d4" class="blinking" />
      <text x="0" y="44" class="mono-tech" fill="#f9a8d4" font-size="8.5" text-anchor="middle" font-weight="600">GPU Texture Ingest</text>
      <text x="0" y="56" class="mono-tech" fill="#636c7e" font-size="7.5" text-anchor="middle">Direct Float32 Uniform Array</text>
    </g>

    <!-- Callout 4 -->
    <g transform="translate(714, 42)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#8f96a6" stroke-width="1" />
      <circle cx="0" cy="28" r="2.5" fill="#8f96a6" />
      <text x="0" y="44" class="mono-tech" fill="#e6e9f0" font-size="8.5" text-anchor="middle" font-weight="600">V-Sync Raster Lock</text>
      <text x="0" y="56" class="mono-tech" fill="#10b981" font-size="7.5" text-anchor="middle">0 Dropped Frames (120Hz)</text>
    </g>
  </g>

  <!-- Technical Spec Footer Footnote -->
  <line x1="28" y1="240" x2="892" y2="240" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
  <g transform="translate(28, 258)" class="mono-tech" font-size="8" fill="#8f96a6">
    <text x="0" y="0">
      Transform3D hardware layer isolation prevents DOM layout thrashing during multi-layer kinetic scrolling.
    </text>
    <text x="864" y="0" text-anchor="end" fill="#5eead4">
      HARDWARE ACCELERATED // GPU COMPOSITED
    </text>
  </g>
</svg>
