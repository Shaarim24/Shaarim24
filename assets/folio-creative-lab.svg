<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <style>
      .mono-tech { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .serif-display { font-family: 'Instrument Serif', Georgia, serif; }
      .sans-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="180" fill="#06080c" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" rx="3" />

  <!-- Left Content Block -->
  <g transform="translate(32, 28)">
    <!-- Folio Tagline -->
    <g class="mono-tech" font-size="9.5">
      <text x="0" y="0" fill="#34d399" font-weight="600" letter-spacing="2">FOLIO 03</text>
      <text x="64" y="0" fill="#525c6a">/</text>
      <text x="76" y="0" fill="#ffffff" font-weight="600" letter-spacing="1">creative-shaders-lab</text>
      
      <rect x="236" y="-10" width="60" height="16" fill="#0d1017" stroke="rgba(52, 211, 153, 0.3)" rx="2" />
      <text x="243" y="2" fill="#34d399" font-size="8">GLSL Shaders</text>

      <rect x="302" y="-10" width="65" height="16" fill="#0d1017" stroke="rgba(56, 189, 248, 0.3)" rx="2" />
      <text x="309" y="2" fill="#38bdf8" font-size="8">Three.js</text>

      <rect x="372" y="-10" width="65" height="16" fill="#0d1017" stroke="rgba(229, 193, 88, 0.3)" rx="2" />
      <text x="379" y="2" fill="#e5c158" font-size="8">GSAP 3</text>
    </g>

    <!-- Title -->
    <text x="0" y="34" class="serif-display" fill="#ffffff" font-size="24" letter-spacing="0">
      Kinetic Shaders: Scroll-Linked WebGL Particle &amp; Spatial Physics
    </text>

    <!-- Summary -->
    <text x="0" y="60" class="sans-body" fill="#94a3b8" font-size="11">
      Custom noise vector displacement fields, dual-mesh structural wireframe topologies,
    </text>
    <text x="0" y="78" class="sans-body" fill="#94a3b8" font-size="11">
      and tactile drag resistance simulating physical weight, mass, and inertia on flat screens.
    </text>

    <!-- Micro Tags -->
    <g transform="translate(0, 104)" class="mono-tech" font-size="8.5">
      <rect x="0" y="0" width="134" height="20" fill="#0d1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="8" y="13" fill="#e2e8f0">144 FPS Hardware Lock</text>

      <rect x="142" y="0" width="130" height="20" fill="#0d1017" stroke="rgba(52, 211, 153, 0.3)" rx="2" />
      <text x="150" y="13" fill="#34d399">Custom GLSL Fragment</text>

      <rect x="280" y="0" width="124" height="20" fill="#0d1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="288" y="13" fill="#e2e8f0">Lenis Smooth Physics</text>

      <rect x="412" y="0" width="124" height="20" fill="#0d1017" stroke="rgba(229, 193, 88, 0.3)" rx="2" />
      <text x="420" y="13" fill="#e5c158">Non-Linear Easing</text>
    </g>
  </g>

  <!-- Right Metrics Plate -->
  <line x1="640" y1="20" x2="640" y2="160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <g transform="translate(668, 28)" class="mono-tech">
    <!-- Row 1 -->
    <g>
      <text x="0" y="0" fill="#717d91" font-size="8" letter-spacing="1">GPU COMPUTE</text>
      <text x="0" y="18" fill="#34d399" font-size="14" font-weight="600">WebGL 2.0</text>
    </g>
    <g transform="translate(120, 0)">
      <text x="0" y="0" fill="#717d91" font-size="8" letter-spacing="1">TARGET FPS</text>
      <text x="0" y="18" fill="#ffffff" font-size="14" font-weight="600">144 Hz</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#717d91" font-size="8" letter-spacing="1">TIMELINE CONTROL</text>
      <text x="0" y="16" fill="#e5c158" font-size="11" font-weight="500">GSAP ScrollTrigger</text>
    </g>
    <g transform="translate(120, 52)">
      <text x="0" y="0" fill="#717d91" font-size="8" letter-spacing="1">AUDIT RATING</text>
      <text x="0" y="16" fill="#10b981" font-size="11" font-weight="500">0 Layout Shifts</text>
    </g>

    <!-- Inspect Action Link -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="216" height="26" fill="#0d1017" stroke="rgba(52, 211, 153, 0.3)" rx="2" />
      <text x="108" y="17" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600" letter-spacing="1">
        EXPLORE SHADER LAB →
      </text>
    </g>
  </g>
</svg>
