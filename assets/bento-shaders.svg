<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 185" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow3" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#040609" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <style>
      .font-sans-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Inter, sans-serif;
        font-weight: 700;
      }
      .font-mono-tech {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace;
      }
      .font-sans-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Inter, sans-serif;
      }
    </style>
  </defs>

  <rect width="470" height="185" fill="url(#cardGlow3)" rx="4" />
  <rect x="0.5" y="0.5" width="469" height="184" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="4" />

  <g transform="translate(24, 22)">
    <!-- Header Spec -->
    <g class="font-mono-tech" font-size="9">
      <text x="0" y="0" fill="#38bdf8" font-weight="600" letter-spacing="1.5">03 // SPATIAL WEBGL MOTION</text>
      <text x="422" y="0" fill="#64748b" text-anchor="end" letter-spacing="1">120 FPS BUDGET</text>
    </g>

    <line x1="0" y1="10" x2="422" y2="10" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

    <!-- Title -->
    <text x="0" y="34" class="font-sans-title" fill="#ffffff" font-size="18" letter-spacing="-0.4">
      Creative Shaders &amp; Motion Lab
    </text>

    <!-- Description -->
    <text x="0" y="56" class="font-sans-body" fill="#94a3b8" font-size="11">
      Custom GLSL fragment shaders &amp; Three.js particle systems.
    </text>
    <text x="0" y="74" class="font-sans-body" fill="#94a3b8" font-size="11">
      GSAP scroll-linked physics with tactile mass &amp; zero jank.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 96)" class="font-mono-tech" font-size="8.5">
      <rect x="0" y="0" width="70" height="20" fill="#0c1017" stroke="rgba(56, 189, 248, 0.3)" rx="2" />
      <text x="35" y="13" fill="#38bdf8" text-anchor="middle">Three.js</text>

      <rect x="76" y="0" width="58" height="20" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="105" y="13" fill="#e2e8f0" text-anchor="middle">GLSL</text>

      <rect x="140" y="0" width="68" height="20" fill="#0c1017" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="174" y="13" fill="#e2e8f0" text-anchor="middle">GSAP 3</text>

      <rect x="214" y="0" width="86" height="20" fill="#0c1017" stroke="rgba(16, 185, 129, 0.25)" rx="2" />
      <text x="257" y="13" fill="#10b981" text-anchor="middle">Lenis Scroll</text>
    </g>

    <!-- Action Link -->
    <g transform="translate(0, 134)" class="font-mono-tech" font-size="9">
      <text x="0" y="0" fill="#38bdf8" font-weight="600" letter-spacing="1">VIEW LAB PORTFOLIO →</text>
      <text x="422" y="0" fill="#64748b" text-anchor="end">SHAARIM.VERCEL.APP</text>
    </g>
  </g>
</svg>
