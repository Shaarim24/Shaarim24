<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Blueprint Grid -->
    <pattern id="headerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="0.75" />
    </pattern>

    <style>
      @keyframes beamSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .beam {
        animation: beamSlide 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .dot-pulse {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: center;
      }
      .font-sans-bold {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 800;
      }
      .font-sans-medium {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 500;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="900" height="220" fill="url(#bgGrad)" rx="8" />
  <rect width="900" height="220" fill="url(#headerGrid)" rx="8" />
  <rect width="900" height="220" fill="url(#cyanGlow)" rx="8" />
  <rect x="0.5" y="0.5" width="899" height="219" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" rx="8" />

  <!-- Animated Laser Beam Top Border -->
  <g opacity="0.9">
    <rect x="0" y="0" width="280" height="2" fill="url(#beamGrad)" class="beam" />
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(36, 32)">
    <!-- Live Pill -->
    <rect x="0" y="0" width="165" height="24" fill="#0c1424" stroke="rgba(16, 185, 129, 0.3)" rx="4" />
    <circle cx="14" cy="12" r="4" fill="#10b981" class="dot-pulse" />
    <text x="26" y="16" fill="#10b981" class="font-mono" font-size="10" font-weight="600" letter-spacing="0.5">AVAILABLE FOR WORK</text>

    <!-- Location & Specs -->
    <g class="font-mono" font-size="10" fill="#64748b">
      <text x="828" y="16" text-anchor="end">
        <tspan fill="#94a3b8">LOC:</tspan> 22.80°N, 86.20°E  <tspan fill="#334155">•</tspan>  <tspan fill="#38bdf8">120 FPS</tspan> V-SYNC
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="36" x2="828" y2="36" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
  </g>

  <!-- Center Identity -->
  <g transform="translate(36, 116)">
    <!-- Subtitle Tag -->
    <text x="0" y="0" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="2.5">
      FULL-STACK DEVELOPER  •  SYSTEMS  •  CREATIVE MOTION
    </text>

    <!-- Main Title -->
    <text x="0" y="42" fill="#ffffff" class="font-sans-bold" font-size="38" letter-spacing="-1">
      Shaarim Alam<tspan fill="#00f0ff">.</tspan>
    </text>

    <!-- Right Side Telemetry Badges -->
    <g transform="translate(568, -4)">
      <!-- Badge 1: MERN -->
      <rect x="0" y="0" width="124" height="26" fill="#0e1726" stroke="rgba(56, 189, 248, 0.25)" rx="4" />
      <text x="62" y="17" fill="#e2e8f0" class="font-mono" font-size="10" text-anchor="middle">MERN Full-Stack</text>

      <!-- Badge 2: C++20 -->
      <rect x="136" y="0" width="124" height="26" fill="#0e1726" stroke="rgba(56, 189, 248, 0.25)" rx="4" />
      <text x="198" y="17" fill="#00f0ff" class="font-mono" font-size="10" text-anchor="middle">C++20 Audio DAC</text>

      <!-- Badge 3: WebGL -->
      <rect x="0" y="32" width="124" height="26" fill="#0e1726" stroke="rgba(56, 189, 248, 0.25)" rx="4" />
      <text x="62" y="49" fill="#00f0ff" class="font-mono" font-size="10" text-anchor="middle">120 FPS WebGL</text>

      <!-- Badge 4: GSAP -->
      <rect x="136" y="32" width="124" height="26" fill="#0e1726" stroke="rgba(16, 185, 129, 0.25)" rx="4" />
      <text x="198" y="49" fill="#10b981" class="font-mono" font-size="10" text-anchor="middle">GSAP Motion</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="36" y1="194" x2="864" y2="194" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <circle cx="36" cy="194" r="2" fill="#00f0ff" />
  <circle cx="864" cy="194" r="2" fill="#00f0ff" />
</svg>
