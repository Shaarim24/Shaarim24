<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="auto">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <style>
      .category-label { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 9.5px; fill: #38bdf8; font-weight: 700; letter-spacing: 1.5px; }
      .tech-item { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 9.5px; fill: #e2e8f0; }
      .header-title { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 11px; fill: #ffffff; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="900" height="160" fill="url(#techBg)" rx="6" />
  <rect x="0.5" y="0.5" width="899" height="159" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" rx="6" />

  <!-- Title bar -->
  <g transform="translate(32, 24)">
    <text x="0" y="0" class="header-title">✦ VERIFIED RUNTIME CAPABILITIES &amp; ARCHITECTURE</text>
    <text x="836" y="0" class="category-label" fill="#10b981" text-anchor="end">PRODUCTION GRADE</text>
    <line x1="0" y1="12" x2="836" y2="12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- 4 Columns -->
  <g transform="translate(32, 58)">
    <!-- Column 1: Core Languages -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="category-label">01 // LANGUAGES</text>
      
      <rect x="0" y="10" width="70" height="22" fill="#0d1422" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="35" y="24" class="tech-item" fill="#38bdf8" text-anchor="middle" font-weight="600">C++20</text>

      <rect x="76" y="10" width="112" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="132" y="24" class="tech-item" text-anchor="middle">JavaScript / ES</text>

      <rect x="0" y="38" width="88" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="44" y="52" class="tech-item" text-anchor="middle">TypeScript</text>

      <rect x="94" y="38" width="68" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="128" y="52" class="tech-item" text-anchor="middle">Lua 5.4</text>
    </g>

    <!-- Column 2: Web & Backend -->
    <g transform="translate(210, 0)">
      <text x="0" y="0" class="category-label">02 // WEB &amp; REALTIME</text>

      <rect x="0" y="10" width="60" height="22" fill="#0d1422" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="30" y="24" class="tech-item" fill="#38bdf8" text-anchor="middle" font-weight="600">React</text>

      <rect x="66" y="10" width="72" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="102" y="24" class="tech-item" text-anchor="middle">Node.js</text>

      <rect x="144" y="10" width="70" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="179" y="24" class="tech-item" text-anchor="middle">Express</text>

      <rect x="0" y="38" width="84" height="22" fill="#0d1422" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="42" y="52" class="tech-item" fill="#38bdf8" text-anchor="middle" font-weight="600">Socket.IO</text>

      <rect x="90" y="38" width="80" height="22" fill="#0d1422" stroke="rgba(16, 185, 129, 0.3)" rx="3" />
      <text x="130" y="52" class="tech-item" fill="#10b981" text-anchor="middle">MongoDB</text>
    </g>

    <!-- Column 3: Graphics & Motion -->
    <g transform="translate(440, 0)">
      <text x="0" y="0" class="category-label">03 // GRAPHICS &amp; MOTION</text>

      <rect x="0" y="10" width="76" height="22" fill="#0d1422" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="38" y="24" class="tech-item" fill="#38bdf8" text-anchor="middle" font-weight="600">Three.js</text>

      <rect x="82" y="10" width="94" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="129" y="24" class="tech-item" text-anchor="middle">GLSL Shaders</text>

      <rect x="0" y="38" width="68" height="22" fill="#0d1422" stroke="rgba(16, 185, 129, 0.3)" rx="3" />
      <text x="34" y="52" class="tech-item" fill="#10b981" text-anchor="middle" font-weight="600">GSAP 3</text>

      <rect x="74" y="38" width="102" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="125" y="52" class="tech-item" text-anchor="middle">Lenis Physics</text>
    </g>

    <!-- Column 4: Systems & Tooling -->
    <g transform="translate(650, 0)">
      <text x="0" y="0" class="category-label">04 // SYSTEMS &amp; INFRA</text>

      <rect x="0" y="10" width="94" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="47" y="24" class="tech-item" text-anchor="middle">Linux / POSIX</text>

      <rect x="100" y="10" width="84" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="142" y="24" class="tech-item" text-anchor="middle">Git / GitHub</text>

      <rect x="0" y="38" width="70" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="35" y="52" class="tech-item" text-anchor="middle">Vite / ES</text>

      <rect x="76" y="38" width="64" height="22" fill="#0d1422" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="108" y="52" class="tech-item" text-anchor="middle">Vercel</text>
    </g>
  </g>
</svg>
