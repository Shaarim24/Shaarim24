<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="900" height="150" fill="url(#cardBg3)" rx="6" />
  <rect x="0.5" y="0.5" width="899" height="149" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" rx="6" />

  <!-- Left Content Group -->
  <g transform="translate(32, 26)">
    <!-- Meta Category Line -->
    <g class="mono" font-size="10">
      <text x="0" y="0" fill="#38bdf8" font-weight="700" letter-spacing="1.5">03 // SPATIAL MOTION</text>
      <text x="180" y="0" fill="#475569">|</text>
      <text x="196" y="0" fill="#e2e8f0">CREATIVE COMPUTING &amp; SHADERS</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="32" class="title">Creative Shaders &amp; Interactive Motion Lab</text>

    <!-- Description -->
    <text x="0" y="58" class="desc">Hardware-accelerated graphics showcase. Custom GLSL fragment shaders, Three.js particle</text>
    <text x="0" y="76" class="desc">systems, and inertia-driven GSAP scroll physics running strictly within a 120 FPS budget.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 92)" class="mono" font-size="9.5">
      <rect x="0" y="0" width="70" height="20" fill="#0e1726" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="35" y="14" fill="#38bdf8" text-anchor="middle" font-weight="600">Three.js</text>

      <rect x="78" y="0" width="94" height="20" fill="#0e1726" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="125" y="14" fill="#cbd5e1" text-anchor="middle">GLSL Shaders</text>

      <rect x="180" y="0" width="60" height="20" fill="#0e1726" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="210" y="14" fill="#cbd5e1" text-anchor="middle">GSAP 3</text>

      <rect x="248" y="0" width="86" height="20" fill="#0e1726" stroke="rgba(16, 185, 129, 0.25)" rx="3" />
      <text x="291" y="14" fill="#10b981" text-anchor="middle">120Hz V-Sync</text>
    </g>
  </g>

  <!-- Right Metrics Card -->
  <g transform="translate(680, 24)">
    <line x1="-30" y1="6" x2="-30" y2="102" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <g class="mono" font-size="10">
      <text x="0" y="14" fill="#64748b">RENDER BUDGET</text>
      <text x="0" y="32" fill="#ffffff" font-size="16" font-weight="700">120 FPS</text>

      <text x="0" y="60" fill="#64748b">ACCELERATION</text>
      <text x="0" y="76" fill="#00f0ff" font-size="12" font-weight="600">WebGL 2.0</text>

      <text x="0" y="100" fill="#00f0ff" font-weight="600">EXPLORE PORTFOLIO ↗</text>
    </g>
  </g>
</svg>
