<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="900" height="150" fill="url(#cardBg2)" rx="6" />
  <rect x="0.5" y="0.5" width="899" height="149" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" rx="6" />

  <!-- Left Content Group -->
  <g transform="translate(32, 26)">
    <!-- Meta Category Line -->
    <g class="mono" font-size="10">
      <text x="0" y="0" fill="#38bdf8" font-weight="700" letter-spacing="1.5">02 // REAL-TIME NETWORK</text>
      <text x="210" y="0" fill="#475569">|</text>
      <text x="226" y="0" fill="#e2e8f0">FULL-STACK MESSAGING PLATFORM</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="32" class="title">Chattic Real-Time Messenger</text>

    <!-- Description -->
    <text x="0" y="58" class="desc">High-throughput WebSocket messaging architecture. Features grouped channels, direct messaging,</text>
    <text x="0" y="76" class="desc">live media file dispatch, real-time reactions, and optimistic state persistence.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 92)" class="mono" font-size="9.5">
      <rect x="0" y="0" width="56" height="20" fill="#0e1726" stroke="rgba(56, 189, 248, 0.3)" rx="3" />
      <text x="28" y="14" fill="#38bdf8" text-anchor="middle" font-weight="600">React</text>

      <rect x="64" y="0" width="76" height="20" fill="#0e1726" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="102" y="14" fill="#cbd5e1" text-anchor="middle">Socket.IO</text>

      <rect x="148" y="0" width="68" height="20" fill="#0e1726" stroke="rgba(255, 255, 255, 0.1)" rx="3" />
      <text x="182" y="14" fill="#cbd5e1" text-anchor="middle">Node.js</text>

      <rect x="224" y="0" width="76" height="20" fill="#0e1726" stroke="rgba(16, 185, 129, 0.25)" rx="3" />
      <text x="262" y="14" fill="#10b981" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Right Metrics Card -->
  <g transform="translate(680, 24)">
    <line x1="-30" y1="6" x2="-30" y2="102" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <g class="mono" font-size="10">
      <text x="0" y="14" fill="#64748b">WIRE LATENCY</text>
      <text x="0" y="32" fill="#ffffff" font-size="16" font-weight="700">&lt; 15ms</text>

      <text x="0" y="60" fill="#64748b">DEPLOYMENT</text>
      <text x="0" y="76" fill="#10b981" font-size="12" font-weight="600">Production Live</text>

      <text x="0" y="100" fill="#00f0ff" font-weight="600">LAUNCH LIVE APP ↗</text>
    </g>
  </g>
</svg>
