<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <style>
      .mono-tech { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .serif-display { font-family: 'Instrument Serif', Georgia, serif; }
      .sans-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="180" fill="#080b10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="4" />

  <!-- Left Content Block -->
  <g transform="translate(32, 28)">
    <!-- Folio Tagline -->
    <g class="mono-tech" font-size="9.5">
      <text x="0" y="0" fill="#5eead4" font-weight="600" letter-spacing="2">FOLIO 02</text>
      <text x="64" y="0" fill="#636c7e">/</text>
      <text x="76" y="0" fill="#ffffff" font-weight="600" letter-spacing="1">chattic-messaging-core</text>
      
      <rect x="250" y="-10" width="80" height="16" fill="#11151c" stroke="rgba(94, 234, 212, 0.3)" rx="2" />
      <text x="257" y="2" fill="#5eead4" font-size="8">MERN + Sockets</text>

      <rect x="338" y="-10" width="70" height="16" fill="#11151c" stroke="rgba(208, 188, 255, 0.3)" rx="2" />
      <text x="345" y="2" fill="#d0bcff" font-size="8">Socket.IO</text>

      <rect x="416" y="-10" width="80" height="16" fill="#11151c" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="423" y="2" fill="#8f96a6" font-size="8">FULL-STACK</text>
    </g>

    <!-- Title -->
    <text x="0" y="34" class="serif-display" fill="#ffffff" font-size="24" letter-spacing="0">
      Chattic: Bi-Directional Real-Time Messaging Architecture
    </text>

    <!-- Summary -->
    <text x="0" y="60" class="sans-body" fill="#8f96a6" font-size="11">
      End-to-end communication network engineered with WebSocket routing, direct channels,
    </text>
    <text x="0" y="78" class="sans-body" fill="#8f96a6" font-size="11">
      instant file transfers, emoji reaction pipelines, and optimistic UI synchronization.
    </text>

    <!-- Micro Tags -->
    <g transform="translate(0, 104)" class="mono-tech" font-size="8.5">
      <rect x="0" y="0" width="134" height="20" fill="#11151c" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="8" y="13" fill="#e6e9f0">Sub-15ms Wire Latency</text>

      <rect x="142" y="0" width="130" height="20" fill="#11151c" stroke="rgba(94, 234, 212, 0.3)" rx="2" />
      <text x="150" y="13" fill="#5eead4">WebSocket Bi-Directional</text>

      <rect x="280" y="0" width="124" height="20" fill="#11151c" stroke="rgba(255, 255, 255, 0.1)" rx="2" />
      <text x="288" y="13" fill="#e6e9f0">Optimistic UI Sync</text>

      <rect x="412" y="0" width="124" height="20" fill="#11151c" stroke="rgba(208, 188, 255, 0.3)" rx="2" />
      <text x="420" y="13" fill="#d0bcff">Mongo Sharded Index</text>
    </g>
  </g>

  <!-- Right Metrics Plate -->
  <line x1="640" y1="20" x2="640" y2="160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <g transform="translate(668, 28)" class="mono-tech">
    <!-- Row 1 -->
    <g>
      <text x="0" y="0" fill="#636c7e" font-size="8" letter-spacing="1">EVENT ROUTING</text>
      <text x="0" y="18" fill="#5eead4" font-size="14" font-weight="600">WebSocket</text>
    </g>
    <g transform="translate(120, 0)">
      <text x="0" y="0" fill="#636c7e" font-size="8" letter-spacing="1">ACTIVE SOCKETS</text>
      <text x="0" y="18" fill="#ffffff" font-size="14" font-weight="600">10k+ Peak</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#636c7e" font-size="8" letter-spacing="1">STATE CONSISTENCY</text>
      <text x="0" y="16" fill="#10b981" font-size="11" font-weight="500">Atomic Mutex</text>
    </g>
    <g transform="translate(120, 52)">
      <text x="0" y="0" fill="#636c7e" font-size="8" letter-spacing="1">REVISION</text>
      <text x="0" y="16" fill="#8f96a6" font-size="11" font-weight="500">v2.4 Production</text>
    </g>

    <!-- Inspect Action Link -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="216" height="26" fill="#11151c" stroke="rgba(94, 234, 212, 0.3)" rx="2" />
      <text x="108" y="17" fill="#5eead4" font-size="9" text-anchor="middle" font-weight="600" letter-spacing="1">
        INSPECT MESSAGING FOLIO →
      </text>
    </g>
  </g>
</svg>
